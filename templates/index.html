<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Photo Booth Printer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(180deg,#f7f7fb,#fff); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-xl">
    <header class="mb-6 text-center">
      <h1 class="text-2xl font-bold">📸 Upload your photos!</h1>
    </header>

    <!-- Counters -->
    <div class="grid grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-4 rounded-lg shadow text-center">
        <div class="text-sm text-gray-500">Next print in</div>
        <div class="text-2xl font-bold" id="next-print">--</div>
        <div class="text-xs text-gray-400">photos</div>
      </div>
      <div class="bg-white p-4 rounded-lg shadow text-center">
        <div class="text-sm text-gray-500">Collages queued</div>
        <div class="text-2xl font-bold" id="to-print">--</div>
      </div>
      <div class="bg-white p-4 rounded-lg shadow text-center">
        <div class="text-sm text-gray-500">Total prints</div>
        <div class="text-2xl font-bold" id="total-prints">--</div>
      </div>
    </div>

    <!-- Upload card -->
    <form id="upload-form" class="bg-white p-5 rounded-xl shadow space-y-4" enctype="multipart/form-data" method="post" action="/upload">
      <label class="block border-2 border-dashed rounded-lg p-8 text-center cursor-pointer hover:border-green-500">
        <input id="file-input" type="file" name="photo" accept="image/*" multiple class="hidden" />
        <div class="text-gray-600">Drag or click to select images</div>
      </label>

      <div id="preview" class="grid gap-4 grid-cols-2"></div>

      <div class="flex justify-end gap-3">
        <button id="clear-btn" type="button" class="px-4 py-2 rounded bg-gray-200">Clear</button>
        <button id="submit-btn" type="submit" class="px-4 py-2 rounded bg-green-600 text-white">Upload</button>
      </div>
    </form>
  </div>

  <!-- modal -->
  <div id="dialog-overlay" class="fixed inset-0 bg-black bg-opacity-30 hidden items-center justify-center">
    <div class="bg-white rounded-lg p-6 w-80 text-center">
      <p id="dialog-message" class="mb-3 text-gray-800"></p>
      <input id="pin-input" type="password" placeholder="Enter PIN" class="border rounded w-3/4 py-1 mx-auto mb-3 hidden" />
      <div id="progress-wrap" class="w-full bg-gray-200 h-3 rounded overflow-hidden hidden mb-3">
        <div id="progress-bar" class="h-3 bg-green-600 w-0"></div>
      </div>
      <div class="flex justify-center gap-3">
        <button id="dialog-ok" class="px-4 py-2 bg-green-600 text-white rounded">OK</button>
        <button id="dialog-cancel" class="px-4 py-2 bg-gray-300 rounded">Cancel</button>
      </div>
    </div>
  </div>

<script>
/* Config */
const HARD_PIN = "6730";
const fileInput = document.getElementById('file-input');
const preview = document.getElementById('preview');
const form = document.getElementById('upload-form');
const dialog = document.getElementById('dialog-overlay');
const dialogMsg = document.getElementById('dialog-message');
const dialogOk = document.getElementById('dialog-ok');
const dialogCancel = document.getElementById('dialog-cancel');
const pinInput = document.getElementById('pin-input');
const progressWrap = document.getElementById('progress-wrap');
const progressBar = document.getElementById('progress-bar');
const clearBtn = document.getElementById('clear-btn');

let files = []; // {file:File, qty: number}
let awaitingConfirmCallback = null;

/* helpers */
function showModal(msg, { showPin=false, onlyOk=false, showProgress=false } = {}, callback=null) {
  dialogMsg.textContent = msg;
  pinInput.classList.toggle('hidden', !showPin);
  pinInput.value = '';
  progressWrap.style.display = showProgress ? 'block' : 'none';
  progressBar.style.width = '0%';
  dialog.classList.remove('hidden');
  dialogOk.disabled = false;
  dialogCancel.style.display = onlyOk ? 'none' : 'inline-block';
  awaitingConfirmCallback = callback;
}

dialogOk.addEventListener('click', () => {
  if (pinInput && !pinInput.classList.contains('hidden')) {
    if (pinInput.value !== HARD_PIN) { alert('Wrong PIN'); return; }
  }
  dialog.classList.add('hidden');
  if (awaitingConfirmCallback) awaitingConfirmCallback(true);
});
dialogCancel.addEventListener('click', () => {
  dialog.classList.add('hidden');
  if (awaitingConfirmCallback) awaitingConfirmCallback(false);
});

/* file selection and preview */
fileInput.addEventListener('change', e => {
  const chosen = Array.from(e.target.files);
  for (const f of chosen) files.push({ file: f, qty: 1 });
  updatePreview();
  fileInput.value = '';
});

clearBtn.addEventListener('click', () => { files = []; updatePreview(); });

function updatePreview() {
  preview.innerHTML = '';
  if (files.length === 0) return;
  if (files.length === 1) preview.classList.remove('grid-cols-2'); else preview.classList.add('grid-cols-2');

  files.forEach((entry, idx) => {
    const card = document.createElement('div');
    card.className = "relative bg-white rounded-lg p-2 shadow";

    const img = document.createElement('img');
    img.className = "w-full h-40 object-cover rounded";
    const reader = new FileReader();
    reader.onload = ev => img.src = ev.target.result;
    reader.readAsDataURL(entry.file);

    const controls = document.createElement('div');
    controls.className = "flex items-center justify-between mt-2";

    const qtyWrap = document.createElement('div');
    qtyWrap.className = "flex items-center gap-2";
    const minus = document.createElement('button'); minus.type='button'; minus.textContent='−';
    const plus = document.createElement('button'); plus.type='button'; plus.textContent='+';
    const qty = document.createElement('input');
    qty.type='number'; qty.min=1; qty.max=35; qty.value=entry.qty; qty.className='w-14 text-center border rounded';
    minus.className = plus.className = 'px-2 py-1 bg-gray-200 rounded';
    minus.addEventListener('click', ()=> { entry.qty = Math.max(1, entry.qty-1); qty.value = entry.qty; });
    plus.addEventListener('click', ()=> { entry.qty = Math.min(35, entry.qty+1); qty.value = entry.qty; });
    qty.addEventListener('input', ()=> { let v=parseInt(qty.value)||1; v=Math.max(1,Math.min(35,v)); entry.qty=v; qty.value=v; });

    qtyWrap.append(minus, qty, plus);

    const del = document.createElement('button');
    del.type='button';
    del.innerHTML = `<svg viewBox="0 0 24 24" class="w-6 h-6 text-red-500"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2"/><line x1="6" y1="18" x2="18" y2="6" stroke="currentColor" stroke-width="2"/></svg>`;
    del.className = 'p-1';
    del.addEventListener('click', ()=> { files.splice(idx,1); updatePreview(); });

    controls.append(qtyWrap, del);

    card.append(img, controls);
    preview.appendChild(card);
  });
}

/* submit handling */
form.addEventListener('submit', e => {
  e.preventDefault();
  if (files.length === 0) { showModal('⚠️ No photos selected.', { onlyOk:true }); return; }

  const over10 = files.some(f => f.qty > 10);
  const doUpload = () => {
    const fd = new FormData();
    // append copies[] for each file (same order)
    files.forEach(entry => fd.append('copies[]', entry.qty));
    // append files
    files.forEach(entry => fd.append('photo', entry.file));

    showModal('📤 Uploading...', { showProgress:true, onlyOk:true });

    const xhr = new XMLHttpRequest();
    xhr.open('POST','/upload',true);
    xhr.upload.onprogress = ev => {
      if (ev.lengthComputable) {
        const pct = Math.round(ev.loaded/ev.total*100);
        progressBar.style.width = pct + '%';
      }
    };
    xhr.onload = () => {
      dialog.classList.add('hidden');
      if (xhr.status === 200) {
        showModal('✅ Photos uploaded successfully!', { onlyOk:true }, ()=>{
          files = []; updatePreview();
        });
      } else {
        showModal('❌ Upload failed.', { onlyOk:true });
      }
    };
    xhr.onerror = () => {
      dialog.classList.add('hidden');
      showModal('❌ Upload failed.', { onlyOk:true });
    };
    xhr.send(fd);
  };

  if (over10) {
    showModal('⚠️ You entered >10 copies for an image. Enter PIN to continue.', { showPin:true }, ok => { if (ok) doUpload(); });
  } else doUpload();
});

/* counters */
async function refreshCounters() {
  try {
    const res = await fetch('/counters');
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById('next-print').innerText = data.upload_count;
    document.getElementById('to-print').innerText = data.to_print_count;
    document.getElementById('total-prints').innerText = data.photos_printed;
  } catch (e) { console.error(e); }
}
refreshCounters();
setInterval(refreshCounters, 5000);
</script>
</body>
</html>
