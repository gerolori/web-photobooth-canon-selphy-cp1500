<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stampa Festa Anita</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/heic-to@1.3.0/dist/iife/heic-to.js"></script>

<link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
<link rel="manifest" href="/static/favicon/site.webmanifest">
<link rel="mask-icon" href="/static/favicon/safari-pinned-tab.svg" color="#5bbad5">
<link rel="shortcut icon" href="/static/favicon/favicon.ico">
<meta name="msapplication-TileColor" content="#da532c">
<meta name="msapplication-config" content="/static/favicon/browserconfig.xml">
<meta name="theme-color" content="#ffffff">

</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">
<header class="text-center py-4">
  <div class="inline-flex bg-gray-200 rounded-full overflow-hidden text-sm mb-4">
    <a href="/" class="px-3 py-1 font-medium transition 
       {{ 'bg-green-600 text-white' if current_path == '/' else 'text-gray-600 hover:bg-gray-300' }}">
       Collage
    </a>
    <a href="/postcard" class="px-3 py-1 font-medium transition 
       {{ 'bg-blue-600 text-white' if current_path == '/postcard' else 'text-gray-600 hover:bg-gray-300' }}">
       Cartoline
    </a>
  </div>

  <h1 class="text-3xl font-bold text-gray-800">Carica le tue foto!</h1>
</header>


<main class="w-full max-w-md space-y-6">

  <div id="counters" class="text-xs sm:text-sm text-gray-600 flex justify-center flex-wrap gap-3 mt-3 mb-4">
  <span>🕓 In coda: <strong id="to-print">0</strong></span>
  <span>🖨️ Stampate: <strong id="total-prints">0</strong></span>
  </div>

  <!-- Contatori -->
  <div class="space-y-3">
    <div class="flex justify-between items-baseline bg-white shadow rounded-lg p-4">
      <span class="text-gray-700 font-medium">Prossimo collage tra:</span>
      <span class="flex items-center gap-1 text-lg font-bold text-gray-800">
        <span id="next-print">0</span><span class="text-sm text-gray-600">foto</span>
      </span>
    </div>
  </div>

  <!-- Form caricamento -->
  <form id="upload-form" action="/upload_collage" method="post" enctype="multipart/form-data"
    class="flex flex-col items-center bg-white shadow-lg rounded-xl p-5 space-y-4 relative">
    <label class="relative border-2 border-dashed border-gray-300 rounded-xl w-full flex flex-col items-center justify-center py-12 cursor-pointer hover:border-green-500 hover:bg-green-50 transition">
      <input type="file" name="photo" accept=".heic,.heif,image/*" multiple
       class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
      <span class="text-gray-600 text-center">Trascina qui le foto o clicca per caricare</span>
    </label>
    <button type="submit" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">Stampa</button>
  </form>

  <!-- Anteprime -->
  <div id="preview" class="grid gap-4 w-full grid-cols-2"></div>
</main>

<!-- Modale notifica -->
<div id="modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center">
  <div class="bg-white rounded-xl shadow-lg p-6 text-center w-80">
    <h2 class="text-lg font-semibold text-gray-800 mb-2" id="modal-title">Notifica</h2>
    <p class="text-gray-600 mb-4" id="modal-message"></p>
    <button onclick="closeModal()"
      class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">OK</button>
  </div>
</div>

<!-- Modale caricamento -->
<div id="loading-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center">
  <div class="bg-white rounded-xl shadow-lg p-6 text-center w-60">
    <div class="animate-spin border-4 border-green-500 border-t-transparent rounded-full w-12 h-12 mx-auto mb-4"></div>
    <p class="text-gray-700">Caricamento in corso...</p>
  </div>
</div>

<!-- Modale conversione HEIC -->
<div id="heic-loading-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center">
  <div class="bg-white rounded-xl shadow-lg p-6 text-center w-60">
    <div class="animate-spin border-4 border-green-500 border-t-transparent rounded-full w-12 h-12 mx-auto mb-4"></div>
    <p class="text-gray-700">Conversione foto iPhone in corso...</p>
  </div>
</div>



<script>
const fileInput = document.querySelector('input[name="photo"]');
const previewContainer = document.getElementById("preview");
const modal = document.getElementById("modal");
const loadingModal = document.getElementById("loading-modal");
let fileList = [];

// Convert a Blob to base64 string (per eventuali preview)
function extractBase64FromBlob(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(String(reader.result));
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// Gestione anteprime + numero copie con heic-to
fileInput.addEventListener("change", async () => {
  const newFiles = Array.from(fileInput.files);

  for (const file of newFiles) {
    let processedFiles = [file];

    const heicExtensions = [".heic", ".heif"];
    const isHeicFile = heicExtensions.some(ext => file.name.toLowerCase().endsWith(ext));

    if (file.type === "image/heic" || isHeicFile) {
      try {
        showHeicLoading(); // ← mostra overlay conversione
        const isHeic = await HeicTo.isHeic(file);
        if (isHeic) {
          let jpgBlob = await HeicTo({
            blob: file,
            type: "image/jpeg",
            quality: 1
          });

          if (Array.isArray(jpgBlob)) jpgBlob = jpgBlob[0];

          processedFiles = [new File([jpgBlob], file.name.replace(/\.(heic|HEIC)$/, ".jpg"), { type: "image/jpeg" })];
        }
      } catch (err) {
        console.error("Errore convertendo HEIC:", err);
        continue;
      } finally {
        hideHeicLoading(); // ← nascondi overlay
      }
    }

    processedFiles.forEach(f => fileList.push({ file: f, copies: 1 }));
  }

  updatePreview();
  fileInput.value = "";
});


function updatePreview() {
  previewContainer.innerHTML = "";
  fileList.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "relative bg-white shadow-md rounded-lg p-2 flex flex-col items-center";

    const img = document.createElement("img");
    img.src = URL.createObjectURL(item.file);
    img.className = "rounded-md mb-2 w-full object-cover";

    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button";
    deleteBtn.className = "absolute top-2 right-2";
    deleteBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" class="w-6 h-6 text-red-500 hover:text-red-700"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
    deleteBtn.addEventListener("click", () => {
      fileList.splice(index, 1);
      updatePreview();
    });

    const copiesContainer = document.createElement("div");
    copiesContainer.className = "flex items-center gap-2 mt-1";

    const minusBtn = document.createElement("button");
    minusBtn.type = "button";
    minusBtn.className = "px-2 py-1 bg-gray-200 rounded hover:bg-gray-300";
    minusBtn.textContent = "-";
    minusBtn.addEventListener("click", () => {
      if (item.copies > 1) {
        item.copies--;
        copiesInput.value = item.copies;
      }
    });

    const copiesInput = document.createElement("input");
    copiesInput.type = "number";
    copiesInput.min = 1;
    copiesInput.max = 35;
    copiesInput.value = item.copies;
    copiesInput.className = "border rounded w-16 text-center";
    copiesInput.addEventListener("change", () => {
      let val = parseInt(copiesInput.value);
      if (isNaN(val) || val < 1) val = 1;
      if (val > 35) val = 35;
      item.copies = val;
      copiesInput.value = val;
    });

    const plusBtn = document.createElement("button");
    plusBtn.type = "button";
    plusBtn.className = "px-2 py-1 bg-gray-200 rounded hover:bg-gray-300";
    plusBtn.textContent = "+";
    plusBtn.addEventListener("click", () => {
      if (item.copies < 35) {
        item.copies++;
        copiesInput.value = item.copies;
      }
    });

    copiesContainer.append(minusBtn, copiesInput, plusBtn);
    card.append(img, copiesContainer, deleteBtn);
    previewContainer.appendChild(card);
  });
}

function showModal(title, message) {
  document.getElementById("modal-title").innerText = title;
  document.getElementById("modal-message").innerText = message;
  modal.classList.remove("hidden");
}
function closeModal() { modal.classList.add("hidden"); }
function showLoading() { loadingModal.classList.remove("hidden"); }
function hideLoading() { loadingModal.classList.add("hidden"); }
function showHeicLoading() { document.getElementById("heic-loading-modal").classList.remove("hidden"); }
function hideHeicLoading() { document.getElementById("heic-loading-modal").classList.add("hidden"); }


document.getElementById("upload-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (fileList.length === 0) {
    showModal("Attenzione", "Nessuna foto selezionata!");
    return;
  }

  let requirePin = fileList.some(item => item.copies > 10);
  let pin = "";
  if (requirePin) {
    pin = prompt("Inserisci PIN per copie >10:");
    if (pin !== "6730") {
      showModal("Errore PIN", "❌ PIN errato!");
      return;
    }
  }

  const formData = new FormData();
  fileList.forEach(item => {
    for (let i=0; i<item.copies; i++) {
      formData.append("photo", item.file, item.file.name);
    }
  });
  if (requirePin) formData.append("pin", pin);

  showLoading();
  try {
    const res = await fetch("/upload_collage", { method: "POST", body: formData });
    if (res.ok) {
      showModal("Fatto!", "✅ Foto caricate con successo!");
      fileList = [];
      updatePreview();
    } else {
      const data = await res.json().catch(()=>({error:"Errore durante il caricamento"}));
      showModal("Errore", "❌ " + (data.error || "Errore durante il caricamento"));
    }
  } catch {
    showModal("Errore", "❌ Errore di connessione al server.");
  } finally {
    hideLoading();
  }
});

// Contatori
async function refreshCounters() {
  try {
    const res = await fetch("/counters");
    const data = await res.json();
    document.getElementById("next-print").innerText = data.upload_count ?? 0;
    document.getElementById("to-print").innerText = data.processed_count ?? 0;
    document.getElementById("total-prints").innerText = data.printed_count ?? 0;
  } catch {}
}
refreshCounters();
setInterval(refreshCounters, 2000);
</script>
</body>
</html>
