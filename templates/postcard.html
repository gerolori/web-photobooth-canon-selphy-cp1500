<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Photo Booth Print</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/heic-to@1.3.0/dist/iife/heic-to.js"></script>

<link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
<link rel="manifest" href="/static/favicon/site.webmanifest">
<link rel="mask-icon" href="/static/favicon/safari-pinned-tab.svg" color="#5bbad5">
<link rel="shortcut icon" href="/static/favicon/favicon.ico">
<meta name="msapplication-TileColor" content="#da532c">
<meta name="msapplication-config" content="/static/favicon/browserconfig.xml">
<meta name="theme-color" content="#ffffff">

</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">
<header class="text-center py-4">
  <div class="inline-flex bg-gray-200 rounded-full overflow-hidden text-sm mb-4">
    <a href="/" class="px-3 py-1 font-medium transition 
       {{ 'bg-green-600 text-white' if current_path == '/' else 'text-gray-600 hover:bg-gray-300' }}">
       Collage
    </a>
    <a href="/postcard" class="px-3 py-1 font-medium transition 
       {{ 'bg-blue-600 text-white' if current_path == '/postcard' else 'text-gray-600 hover:bg-gray-300' }}">
       Postcards
    </a>
  </div>
  <h1 class="text-3xl font-bold text-gray-800">Upload your postcards!</h1>
</header>

<main class="w-full max-w-md space-y-6">
  <div id="counters" class="text-xs sm:text-sm text-gray-600 flex justify-center flex-wrap gap-3 mt-3 mb-4">
    <span>🕓 Queued: <strong id="to-print">0</strong></span>
    <span>🖨️ Printed: <strong id="total-prints">0</strong></span>
  </div>

  <form id="upload-form" class="flex flex-col items-center bg-white shadow-lg rounded-xl p-5 space-y-4 relative">
    <label class="relative border-2 border-dashed border-gray-300 rounded-xl w-full flex flex-col items-center justify-center py-12 cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition">
      <input type="file" name="photo" accept=".heic,.heif,image/*" multiple
        class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
      <span class="text-gray-600 text-center">Drag postcards here or click to upload</span>
    </label>
    <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Print</button>
  </form>

  <div id="preview" class="grid gap-4 w-full grid-cols-2"></div>
</main>

<!-- Notification modal -->
<div id="modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center">
  <div class="bg-white rounded-xl shadow-lg p-6 text-center w-80">
    <h2 class="text-lg font-semibold text-gray-800 mb-2" id="modal-title">Notification</h2>
    <p class="text-gray-600 mb-4" id="modal-message"></p>
    <button onclick="closeModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">OK</button>
  </div>
</div>

<!-- Loading modal -->
<div id="loading-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center">
  <div class="bg-white rounded-xl shadow-lg p-6 text-center w-60">
    <div class="animate-spin border-4 border-blue-500 border-t-transparent rounded-full w-12 h-12 mx-auto mb-4"></div>
    <p class="text-gray-700">Uploading...</p>
  </div>
</div>

<!-- HEIC conversion modal -->
<div id="heic-loading-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center">
  <div class="bg-white rounded-xl shadow-lg p-6 text-center w-60">
    <div class="animate-spin border-4 border-blue-500 border-t-transparent rounded-full w-12 h-12 mx-auto mb-4"></div>
    <p class="text-gray-700">Converting iPhone photos...</p>
  </div>
</div>

<script>
const HARD_CODED_PIN = "6730";
const fileInput = document.querySelector('input[name="photo"]');
const previewContainer = document.getElementById("preview");
let fileList = [];

function showModal(title, message) {
  document.getElementById("modal-title").innerText = title;
  document.getElementById("modal-message").innerText = message;
  document.getElementById("modal").classList.remove("hidden");
}
function closeModal() { document.getElementById("modal").classList.add("hidden"); }
function showLoading() { document.getElementById("loading-modal").classList.remove("hidden"); }
function hideLoading() { document.getElementById("loading-modal").classList.add("hidden"); }
function showHeicLoading() { document.getElementById("heic-loading-modal").classList.remove("hidden"); }
function hideHeicLoading() { document.getElementById("heic-loading-modal").classList.add("hidden"); }

fileInput.addEventListener("change", async () => {
  const newFiles = Array.from(fileInput.files);

  for (const file of newFiles) {
    let processedFiles = [file];

    const heicExtensions = [".heic", ".heif"];
    const isHeicFile = heicExtensions.some(ext => file.name.toLowerCase().endsWith(ext));

    if (file.type === "image/heic" || isHeicFile) {
      try {
        showHeicLoading();
        const isHeic = await HeicTo.isHeic(file);
        if (isHeic) {
          let jpgBlob = await HeicTo({ blob: file, type: "image/jpeg", quality: 1 });
          if (Array.isArray(jpgBlob)) jpgBlob = jpgBlob[0];
          processedFiles = [new File([jpgBlob], file.name.replace(/\.(heic|HEIC|heif|HEIF)$/, ".jpg"), { type: "image/jpeg" })];
        }
      } catch (err) {
        console.error("Error converting HEIC:", err);
        continue;
      } finally {
        hideHeicLoading();
      }
    }

    processedFiles.forEach(f => fileList.push({ file: f, copies: 1 }));
  }

  updatePreview();
  fileInput.value = "";
});

function updatePreview() {
  previewContainer.innerHTML = "";
  fileList.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "relative bg-white shadow-md rounded-lg p-2 flex flex-col items-center";

    const img = document.createElement("img");
    img.src = URL.createObjectURL(item.file);
    img.className = "rounded-md mb-2 w-full object-cover";

    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button";
    deleteBtn.className = "absolute top-2 right-2";
    deleteBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" class="w-6 h-6 text-red-500 hover:text-red-700"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
    deleteBtn.addEventListener("click", () => { fileList.splice(index, 1); updatePreview(); });

    const copiesContainer = document.createElement("div");
    copiesContainer.className = "flex items-center gap-2 mt-1";

    const minusBtn = document.createElement("button");
    minusBtn.type = "button";
    minusBtn.className = "px-2 py-1 bg-gray-200 rounded hover:bg-gray-300";
    minusBtn.textContent = "-";
    minusBtn.addEventListener("click", () => { if(item.copies>1){item.copies--;copiesInput.value=item.copies;} });

    const copiesInput = document.createElement("input");
    copiesInput.type="number"; copiesInput.min=1; copiesInput.max=35; copiesInput.value=item.copies;
    copiesInput.className="border rounded w-16 text-center";
    copiesInput.addEventListener("change",()=>{let val=parseInt(copiesInput.value); if(isNaN(val)||val<1) val=1; if(val>35) val=35; item.copies=val; copiesInput.value=val;});

    const plusBtn = document.createElement("button");
    plusBtn.type="button"; plusBtn.className="px-2 py-1 bg-gray-200 rounded hover:bg-gray-300"; plusBtn.textContent="+";
    plusBtn.addEventListener("click",()=>{if(item.copies<35){item.copies++;copiesInput.value=item.copies;}});

    copiesContainer.append(minusBtn,copiesInput,plusBtn);
    card.append(img,copiesContainer,deleteBtn);
    previewContainer.appendChild(card);
  });
}

document.getElementById("upload-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if(fileList.length===0){showModal("Warning","No postcards selected!");return;}

  const pin = prompt("Enter PIN to confirm upload:");
  if(pin!==HARD_CODED_PIN){showModal("PIN Error","❌ Wrong PIN!");return;}

  const formData = new FormData();
  fileList.forEach(item=>{for(let i=0;i<item.copies;i++){formData.append("photo",item.file,item.file.name);}});
  formData.append("pin",pin);

  showLoading();
  try{
    const res = await fetch("/upload_postcard",{method:"POST",body:formData});
    const data = await res.json().catch(()=>({error:"Upload error"}));
    if(res.ok){showModal("Done!","✅ Postcards uploaded and sent to print!"); fileList=[]; updatePreview();}
    else{showModal("Error","❌ "+(data.error||"Upload error"));}
  }catch{showModal("Error","❌ Server connection error.");}
  finally{hideLoading();}
});

// Counters
async function refreshCounters() {
  try{
    const res=await fetch("/counters"); const data=await res.json();
    document.getElementById("to-print").innerText = data.processed_count ?? 0;
    document.getElementById("total-prints").innerText = data.printed_count ?? 0;
  }catch{}
}
refreshCounters(); setInterval(refreshCounters,2000);
</script>
</body>
</html>
